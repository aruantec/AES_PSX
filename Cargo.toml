[package]
name = "aruanpsx"
version = "0.1.0"
edition = "2024"
description = "PlayStation (PSX) emulator core — standalone library, embeddable via the Core trait"
license = "MIT"

[dependencies]
cranelift-frontend = { version = "0.137.0", optional = true }
cranelift-jit = { version = "0.137.0", optional = true }
cranelift-module = { version = "0.137.0", optional = true }
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
bytemuck = "1.25"
cpal = "0.15"
gilrs = "0.11"
minifb = "0.28.0"
pollster = "1.0"
wgpu = "30.0"
winit = "0.30"

[features]
default = ["dynarec"]
dynarec = ["cranelift-codegen", "cranelift-jit", "cranelift-module", "cranelift-frontend"]
cranelift-codegen = ["dep:cranelift-codegen"]
cranelift-jit = ["dep:cranelift-jit"]
cranelift-module = ["dep:cranelift-module"]
cranelift-frontend = ["dep:cranelift-frontend"]

[dependencies.cranelift-codegen]
version = "0.137.0"
optional = true

# The boot tests execute hundreds of millions of instructions.
[profile.test]
opt-level = 3
